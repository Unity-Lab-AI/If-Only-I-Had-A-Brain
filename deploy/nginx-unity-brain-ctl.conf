# ═══════════════════════════════════════════════════════════════════════════
# unity-brain-ctl.conf — nginx lanes for the ALWAYS-UP brain control plane.
#
# Include this INSIDE the brain vhost's `server { ... }` block:
#
#     include snippets/unity-brain-ctl.conf;
#
# ── WHAT THIS FIXES ────────────────────────────────────────────────────────
# Two separate failures, both caused by the brain being the only backend:
#
#  1. When the brain is down, `/public-state.json` and `/minds-eye.json`
#     returned a raw nginx 502 HTML page. Callers `fetch().then(r => r.json())`
#     and got a JSON parse error, so the UI showed a broken/blank state instead
#     of saying "brain offline". Worse, on the lab vhost an unproxied path falls
#     through to `location /` → `index.html`, so the viewer parsed the whole SPA
#     as JSON. Now nginx intercepts the upstream error and returns a real JSON
#     body with `brainOnline: false` — same shape, honest content, HTTP 200 so
#     the frontend takes its normal path.
#
#  2. The power controls lived only inside the brain, so a stopped brain could
#     not be started from the web at all. `/ctl/` proxies to unity-brain-ctl on
#     :7526, a separate always-up service that CAN start it.
#
# The static site is untouched by all of this and stays up regardless — that is
# the whole requirement: web server up, brain optionally down, and the page says
# so plainly.
# ═══════════════════════════════════════════════════════════════════════════

# ── The control plane (always up, even with the brain dead) ────────────────
# Same HTTP Basic gate as /admin/ — these are privileged power verbs. nginx
# vouches the authenticated login as X-UAL-User, never trusting a client value.
#
# NOTE the trailing slash on proxy_pass: it strips nothing here because
# brain-ctl.js accepts BOTH /ctl/status and /status, so the lane works whether
# or not a future edit changes the prefix handling.
location /ctl/ {
    auth_basic "Unity admin";
    auth_basic_user_file /etc/nginx/unity-admin.htpasswd;

    proxy_pass http://127.0.0.1:7526;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-UAL-User $remote_user;   # proxy-vouched identity
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # A start waits for the brain to load ~5.4 GB of weights and bind its port
    # before reporting back, which legitimately takes minutes. The default 60s
    # read timeout would abort that mid-flight and report a false failure while
    # the brain was in fact coming up correctly.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Never cache a power-control response or a status snapshot.
    add_header Cache-Control "no-store" always;

    # If the CONTROL PLANE itself is unreachable, say precisely that — it is a
    # different problem (and a much rarer one) than the brain being down, and it
    # is the one case that still needs a shell.
    proxy_intercept_errors on;
    error_page 502 503 504 = @ctl_unreachable;
}

location @ctl_unreachable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"ok":false,"ctlOnline":false,"error":"control plane unreachable","human":"The brain control plane (unity-brain-ctl on :7526) is not answering, so power controls are unavailable. This is the one case that needs shell access: `sudo systemctl start unity-brain-ctl`.","at":"nginx"}';
}

# ── Public snapshots — degrade to honest JSON instead of a 502 HTML page ───
# `proxy_intercept_errors on` lets nginx replace the upstream's error with our
# own body. The named-location indirection is required because `error_page` with
# an inline `return` cannot live in the same block as `proxy_pass`.
location = /public-state.json {
    proxy_pass http://unity_brain;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-UAL-User "";              # strip client identity
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Fail FAST when the brain is down: without this, a dead upstream can hang
    # the request for the full connect timeout and the "brain offline" banner
    # takes ages to appear. 2s is plenty on loopback.
    proxy_connect_timeout 2s;

    proxy_intercept_errors on;
    error_page 502 503 504 = @brain_offline_state;
}

location = /minds-eye.json {
    proxy_pass http://unity_brain;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-UAL-User "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;

    proxy_intercept_errors on;
    error_page 502 503 504 = @brain_offline_mindseye;
}

# HTTP 200 with an explicit `brainOnline: false`, NOT an error status.
# Deliberate: every existing caller does `r.ok ? r.json() : null` and then
# renders "offline" from a null — which is indistinguishable from a network
# failure. Returning a parseable body with a machine-readable flag and a
# human-readable sentence lets the UI say WHY, and lets the dashboard offer a
# Start button instead of a dead end. `brainOffline: true` is included as a
# second, unambiguous name so a caller cannot mistake a missing field for false.
location @brain_offline_state {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"type":"state","brainOnline":false,"brainOffline":true,"offlineReason":"upstream-unreachable","human":"Brain offline — the brain process is not running or is still loading. The site stays up; an admin can start it from the dashboard.","ctl":"/ctl/status","state":null}';
}

location @brain_offline_mindseye {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"brainOnline":false,"brainOffline":true,"offlineReason":"upstream-unreachable","human":"Brain offline — nothing to imagine right now. The site stays up; an admin can start the brain from the dashboard.","ctl":"/ctl/status","note":"brain offline","frame":null}';
}
