[Service]
# 2026-08-26 (Sponge) — FIX A SILENT 3-MONTH BACKUP OUTAGE.
#
# Every nightly run since 2026-05-20 failed with:
#     Fatal: Resolving password failed: /root/.restic-password does not exist
# The file DOES exist (mode 0600, root). The service's own `ProtectHome=true`
# makes /root inaccessible to the unit, so restic could never read its password.
# Proven with:
#     systemd-run -p ProtectHome=true /bin/sh -c 'test -r /root/.restic-password'
#       -> BLOCKED
#
# Consequence while broken: the repo held ONE snapshot (2026-05-20) and nothing
# newer — no Forgejo backup, no lab git backup, and critically no brain weights,
# even though nightly-backup.sh had been extended on 2026-06-30 specifically to
# stage the trained brain state. The backup silently protected nothing.
#
# ProtectHome=read-only still denies /home and /run/user but leaves /root
# readable, which is the minimum needed here. Keeping the hardening rather than
# dropping it, and NOT moving the secret, because a credential move is the kind
# of change that quietly breaks other callers.
ProtectHome=read-only

# Make a future failure LOUD. A backup that fails silently is worse than no
# backup, because it buys false confidence — which is exactly what happened
# here for three months.
ExecStopPost=/bin/sh -c 'test "$EXIT_STATUS" = "0" || logger -t nightly-backup -p user.err "BACKUP FAILED (status=$EXIT_STATUS) — brain weights and Forgejo are NOT protected. Investigate: journalctl -u nightly-backup -n 50"'
