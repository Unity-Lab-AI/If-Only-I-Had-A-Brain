[Service]
# 2026-09-04 (Sponge, after Gee's redeploy+freshwalk failed) — ProtectHome=true
# made /home an EMPTY tmpfs for this service, hiding /home/unity/.ssh — the
# Forgejo DEPLOY KEY + known_hosts.
#
# `/ctl/update` asks the brain first, but when the brain's event loop is starved
# it "accepts nothing" and ctl FALLS BACK to running deploy/self-update.sh itself
# — inside THIS sandbox. The clone then failed with:
#     hostkeys_find_by_key_hostfile: hostkeys_foreach failed for
#     /home/unity/.ssh/known_hosts: Permission denied
#     Host key verification failed.  /  fatal: Could not read from remote repository.
#     [self-update] FATAL — git clone of the CODE repo failed; aborting.
#
# The key and its permissions were always fine (unity:unity, 0600/0644); as the
# unity user the same clone succeeds. This is the SANDBOX, not the filesystem,
# which is why it masquerades as a deploy-key authorisation problem.
#
# read-only still blocks WRITES to /home and still hides /root, so the hardening
# that matters is kept.
#
# ⭐ SECOND OCCURRENCE OF THIS EXACT TRAP on this box — nightly-backup.service
# failed silently for 3 months because ProtectHome=true hid /root/.restic-password
# (see ../nightly-backup/ + REDEPLOY-NOTES 2026-08-26). Rule: if a unit reads a
# secret from a home directory, ProtectHome=true breaks it and systemd is never
# named in the error. One-line proof:
#     systemd-run -p ProtectHome=true -p User=unity /bin/sh -c 'ls /home/unity/.ssh'
ProtectHome=read-only
