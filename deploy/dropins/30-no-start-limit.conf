[Unit]
# 2026-08-26 (Sponge, via Gee) — DISABLE systemd's start-rate limiter.
# systemd default: 5 starts / 10s, then the unit is left PERMANENTLY dead
# ("start request repeated too quickly"). A boot-time crash loop at 411M
# neurons burns that budget in under a minute and then never retries,
# stranding the box with no dashboard left to press a recovery button on.
# 0 disables the limiter so Restart=always + RestartSec=5 retries forever
# and a fixed overlay self-recovers without needing shell access.
#
# Applied as a DROP-IN rather than by overwriting the main unit, because the
# installed unit carries box-local edits the repo copy does not have
# (RestartPreventExitStatus=42 + SuccessExitStatus=42 + the cgroup caps).
# Overwriting from repo would have REGRESSED the box. See REDEPLOY-NOTES.
StartLimitIntervalSec=0
