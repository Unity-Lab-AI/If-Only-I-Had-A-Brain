[Service]
# 2026-09-08 — SHRINK THE WEIGHT BUDGET SO SHE STOPS BOOTING ABOVE HER OWN CEILING.
#
# ⛔⛔ THE SIZING LEFT ZERO MARGIN BY CONSTRUCTION, AND ITS OVERHEAD FIGURE WAS
# UNDER-MEASURED BY ~900 MB. So every boot landed ABOVE MemoryHigh and spent
# itself in direct reclaim that cannot succeed.
#
# The boot line does exactly this:
#     budget = MemoryHigh_MB - DREAM_CGROUP_OVERHEAD_MB     (then min'd with the
#                                                            host reserve)
# At the shipped default that is 20480 - 2867 = 17613 MB of weights, and
# 17613 + 2867 = 20480 = EXACTLY MemoryHigh. **A budget that consumes its whole
# ceiling has no room for being wrong, and it was wrong.**
#
# MEASURED ON TWO CONSECUTIVE BOOTS (2026-09-08), anon from memory.stat:
#
#   boot        MemoryHigh  budget     neurons        actual anon   => real overhead
#   00:21:31Z   20G         17,613 MB  388,597,268    21,333 MB        3,720 MB
#   01:20:24Z   22G         18,519 MB  411,216,550    22,395 MB        3,876 MB
#
# Real overhead is ~3,720-3,876 MB against a claimed 2,867 — the missing ~900 MB
# is the whole overshoot, and both boots stalled with /health timing out,
# proc state `Dsl`, and ~628 futile `memory.high` events per second.
#
# ⛔ WHY RECLAIM CANNOT SAVE HER: the cgroup carries `file 0` (no page cache to
# drop) and the host's 1 GB of swap is 99.99% full with none of it hers
# (`memory.swap.current = 0`). There is nothing reclaimable, so the kernel spins
# forever. This is the documented dead band — nothing kills her, nothing revives
# her.
#
# ⚠ RAISING MemoryHigh IS NOT THE ALTERNATIVE AND HAS BEEN TRIED. On 2026-09-08 it
# produced a host-wide OOM kill (`constraint=CONSTRAINT_NONE, global_oom`,
# `oom_kill = 0` in her own cgroup) because the host had 1.13 GB available. **A
# cgroup ceiling set above the host's real free memory is not a ceiling at all.**
#
# ⭐ THE VALUE AS FIRST SET: take the conservative real overhead (3,876 MB) and
# leave ~1 GB of headroom below MemoryHigh.
#
#     budget      = 20,480 - 4,900          = 15,580 MB
#     expected RSS = 15,580 + ~3,876        = ~19,456 MB   (~1,024 MB under 20G)
#     neurons     ~ 15,580 x ~22,100/MB     = ~344,000,000
#
# ⛔⛔ AND THAT DERIVATION WAS WRONG, MEASURED THE SAME NIGHT — 4,900 IS NOT
# ENOUGH FOR A **RESUME** BOOT. Kept above rather than rewritten, because the
# mistake is the finding.
#
# I computed "real overhead" as (actual anon - budget), but the allocator takes a
# further 2,048 MB OS reserve out of the budget before it allocates weights, so
# the correct comparison is against the WEIGHTS figure:
#
#     budget 15,580 - 2,048 OS reserve   = 13,532 MB for weights
#     actual anon, measured              = 20,957 MB
#     => real non-weight overhead        =  7,425 MB      (not 3,876)
#
# ⭐⭐ AND ~4,931 MB OF THAT IS THE SAVED WEIGHT FILE ITSELF:
#     "[Brain] Binary weights queued for apply - 17 sections, 4931.4 MB"
#
# **DREAM_CGROUP_OVERHEAD_MB=2867 IS CORRECT FOR A FRESH BOOT AND THE SIZING HAS
# NO TERM FOR A RESUME.** A savestart resume loads that binary weight file on top
# of everything the model knows about, so every resume boot overshoots by roughly
# the size of the file — and a press IS a savestart resume. That is the mechanism
# behind the repeated "listening but not answering" stalls, confirmed by
# memory.pressure `some avg10 = 84.36` against io.pressure 0.36 and cpu.pressure
# 0.00: memory, not disk, not CPU.
#
# ⭐ WHAT THIS FILE ACHIEVES AS IT STANDS: a FRESH boot fits comfortably —
# measured 6.52 GiB early in the walk, 32% of the ceiling, 0 high events, memory
# PSI 0.00, /health 200 in 0.95 ms. Steady state should approach
# 13,532 + ~2,500 = ~16,000 MB, ~78% of ceiling.
#
# ⛔⛔ WHAT IT DOES **NOT** FIX: THE NEXT `Update & Savestart` PRESS WILL VERY
# LIKELY RE-TRIGGER THE STALL, because that boot resumes and re-loads the weight
# file. Two ways to close it, and the second is the real one:
#   1. raise this to ~8,000 before the next press (measured basis: real resume
#      overhead 7,425 MB; solving budget x 1.36 + 2,500 <= 19,480 gives
#      budget <= 12,485, i.e. overhead 7,995). Costs neurons: ~337.8M -> ~275M.
#   2. GIVE THE SIZING A TERM FOR IT — on a resume, subtract the on-disk weight
#      file's actual size from the budget. Then the model stops being wrong by
#      exactly the amount it is wrong by, at any scale, with no knob to re-tune.
# ⚠ Prefer measuring her real steady state and real save-file size first; the
# 1.36 factor above is an extrapolation from a single data point.
#
# ⛔ THIS RESIZES HER, WHICH WIPES THE TRAINED WEIGHTS — accepted on the operator's
# explicit instruction 2026-09-08. `autoClearStaleState` clears when the saved
# neuron count disagrees with the computed one, and `server/lang-geometry.json`'s
# pin stops applying once the weights are gone. That cost was stated and chosen;
# the walk had passed ZERO cells, so what is lost is the definition-anchoring and
# prevocab work, not a completed curriculum.
#
# ⚠ RAISE THIS FURTHER, NEVER LOWER IT, unless a fresh measurement of
# (actual anon - budget) is in hand. Lowering it re-arms the identical stall.
#
# ─────────────────────────────────────────────────────────────────────────────
# ✅ 2026-09-08 (later) — OPTION 2 SHIPPED. THE SIZING NOW HAS A RESUME TERM.
#
# `brain-server.js` stats the weight pair it is about to read and subtracts that
# from the budget whenever this boot intends to resume. It prints the term every
# boot, including when it is zero, so "no reserve was needed" and "the term does
# not exist" can never look the same again.
#
# ⚠ SO THIS KNOB IS NOW OVER-CONSERVATIVE ON A RESUME, AND THAT IS THE SAFE
# DIRECTION. 4,900 was 2,867 plus a hand patch FOR the missing term; the term is
# now applied on top of it, so a resume boot reserves roughly
#     4,900 + <weight-file MB>   e.g. 4,900 + 4,931 = 9,831
# where the measurement said ~7,995 is enough. She will boot SMALLER than she has
# to on a resume. She will not stall.
#
# ⭐ TO RECLAIM THAT: return this to the measured FRESH-boot figure (2867, i.e.
# delete this drop-in) once ONE resume boot has been observed with the term in
# place — read the `RESUME SIZING TERM` line, then `memory.current` against
# `memory.high` at steady state.
#
# ⛔ BUT DO NOT DO IT CASUALLY: changing this changes the neuron count, and a
# neuron-count change WIPES THE TRAINED WEIGHTS via autoClearStaleState. That is
# an operator decision about when a wipe is acceptable, never a tidy-up.
Environment=DREAM_CGROUP_OVERHEAD_MB=4900
