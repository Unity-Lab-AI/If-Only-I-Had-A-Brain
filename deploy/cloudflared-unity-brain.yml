# cloudflared — the public route to the brain running on the OPERATOR'S PC.
#
# ── WHAT THIS REPLACES ──────────────────────────────────────────────────────
# The brain used to live on a box behind nginx at
# if-only-i-had-a-brain.git.unityailab.com. That host stopped serving her on
# 2026-10-17 (410 Gone on every route, and a TLS certificate issued for a
# different name — nginx has no `server` block for her any more). The new shape
# is: GitHub Pages serves the STATIC SITE, this machine runs the BRAIN, and
# this tunnel is the only thing joining them.
#
#     GitHub Pages (public site)
#           |  https:// + wss://
#           v
#     <your tunnel hostname>        <- Cloudflare edge, TLS terminated here
#           |  outbound-only tunnel, NO open ports on the router
#           v
#     127.0.0.1:7525                <- the brain, still loopback-only
#
# ⭐⭐ THIS FILE IS LIVE AS OF 2026-10-19. The day a domain exists again came.
#
# ⛔ THE HISTORY, KEPT BECAUSE IT EXPLAINS THE SHAPE: on 2026-10-18 the lab had
# no Cloudflare zone (operator: "we dont have unityailab.com anymore, its a dead
# site"), a *named* Cloudflare tunnel requires one, and so Tailscale Funnel was
# chosen instead (`deploy/tailscale-funnel.bat`, same lanes, same default-deny).
#
# ⚠ WHAT CHANGED, AND WHY IT HAD TO: the Funnel's bandwidth is capped and NOT
# configurable (Tailscale's own documentation). Measured live on 2026-10-19 a
# donor dialling the Funnel moved its cortex upload at **0.16 MB/s** — ~8 hours
# for 4.5 GB, i.e. unusable rather than slow — while the same upload over
# loopback ran at **541.78 MB/s**. The Funnel is fine for the website's small
# reads; it cannot carry a REMOTE DONOR, which is the whole point of
# `compute.html` and the donor app. That is the gap this file closes.
#
# ⭐ SO BOTH RUN, DELIBERATELY, AND THEY CARRY DIFFERENT TRAFFIC:
#   • Tailscale Funnel  — the website's public reads (still live, unchanged).
#   • THIS Cloudflare tunnel on `brain.theunitybrain.com` — the DONOR lane, no
#     relay cap. The donor app's default server points here.
# The route allowlist below is identical in both, which is the part that matters.
#
# ⛔ `theunitybrain.com` moved to Cloudflare DNS on 2026-10-19 to make this
# hostname possible. Its nameservers are now brodie/dorthy.ns.cloudflare.com.
# ⚠ EVERY ONE of its pre-existing records was carried across and set DNS-ONLY
# (grey cloud) so the GitHub Pages site and the Namecheap mail forwarding behave
# EXACTLY as they did on the registrar's nameservers: four Pages A records, the
# `www` CNAME to unity-lab-ai.github.io, five `eforward*.registrar-servers.com`
# MX records and the SPF TXT. **Do not proxy those.** Only `brain` is proxied,
# because a tunnel CNAME has to be.
#
# ⭐ THE BRAIN NEVER STOPS BEING LOOPBACK-ONLY. `BIND_HOST` stays 127.0.0.1 and
# nothing on the LAN or the internet can address it directly; cloudflared is
# the single process allowed to speak to it. That is strictly safer than
# binding 0.0.0.0 and firewalling afterwards.
#
# ── ⛔⛔ THE ALLOWLIST IS THE SECURITY CONTROL. READ BEFORE EDITING. ─────────
# The rules below are DEFAULT-DENY: the final catch-all answers 404, so a route
# is reachable only if it is named here. The three that are named are exactly
# the three the old public nginx vhost forwarded without auth
# (deploy/nginx-unity-brain.conf — `= /public-state.json`, `= /minds-eye.json`,
# `/ws`). They are read-only and already carry `Access-Control-Allow-Origin: *`
# in brain-server.js, which is why a page served from GitHub can use them.
#
# ⛔⛔ THE ADMIN LANE IS DELIBERATELY ABSENT, AND ADDING IT WITHOUT AUTH WOULD
# HAND THE INTERNET A BRAIN-WIPE BUTTON.
#
#   `requireLoopback` (brain-server.js:10052) decides authorisation from
#   `req.socket.remoteAddress`. A TUNNEL FORWARDS FROM 127.0.0.1 — so every
#   request arriving through cloudflared looks like loopback and PASSES. The
#   brain's own comment at :10065 says so: "behind the reverse proxy, loopback
#   is universal — gate brain-mutating endpoints on the proxy-vouched identity
#   instead." On the box, nginx Basic auth supplied that identity. nginx is
#   gone. Nothing supplies it today.
#
#   So `POST /reset` — which wipes every trained weight — would be a public URL
#   requiring no credential, reachable by one curl.
#
# ⚠ AND `UAL_PROXY_AUTH=1` ALONE IS NOT ENOUGH. It only checks that an
#   `X-UAL-User` header is PRESENT. Whatever terminates TLS must therefore
#   STRIP any inbound copy of that header and set it from real authentication —
#   otherwise a caller simply sends the header themselves and is trusted.
#
# ⭐ The supported way to add the admin lane later is Cloudflare Access in front
#   of an `/admin/` rule: it authenticates the user, injects its own identity
#   header, and removes client-supplied copies. **Do not add that rule until
#   the forged-header attack has been ATTEMPTED FROM OUTSIDE and observed to
#   fail.** A security control that has only been reasoned about is not one.
#
# ── SETUP — ALREADY DONE 2026-10-19, recorded so it can be redone ───────────
#   cloudflared tunnel create unity-brain      -> id 30417290-1c95-4a10-8648-15a70646938f
#   # ⛔ `cloudflared tunnel route dns` DID NOT WORK for this hostname and the
#   # way it failed is worth knowing: the `cert.pem` in ~/.cloudflared was issued
#   # for the OLD zone list, so cloudflared could not see theunitybrain.com and
#   # silently appended it to the zone it COULD see — creating a junk record
#   # literally named `brain.theunitybrain.com.unityailab.com` pointed at an
#   # unrelated tunnel, and reporting success. It was deleted by hand.
#   # A tunnel route is only a proxied CNAME, so the record was created directly:
#   #     brain  CNAME  30417290-1c95-4a10-8648-15a70646938f.cfargotunnel.com  (Proxied)
#   # Re-running `cloudflared tunnel login` and re-picking the zone would also
#   # fix it, at the cost of overwriting the cert the other tunnels use.
#   cloudflared tunnel --config deploy/cloudflared-unity-brain.yml run
#
# ⭐ YOU DO NOT NORMALLY RUN ANY OF THIS BY HAND. Since 2026-10-19 all four
# launchers (`windows/start.bat`, `windows/Savestart.bat`, `linux/start.sh`,
# `linux/Savestart.sh`) start this tunnel themselves, right after the Funnel
# block, as a plain background process — idempotent, no elevation, and nothing
# for the operator to remember. The donor door opens whenever she does, which
# is the only moment it has anything to serve.
#
# ⛔ THE ARGUMENT ORDER IS LOAD-BEARING: `cloudflared --config <cfg> tunnel run`.
# With a bare `run` cloudflared prints "Use `cloudflared tunnel run` to start
# tunnel <id>" and EXITS 0 — so a launcher trusting the exit code reports the
# donor door open while nothing is listening. That shipped in the first cut of
# the launcher block and was caught by killing the process and re-running it,
# not by reading the line.
#
# Optional, and only if you want it up even when she is not:
#   cloudflared service install        (Windows: installs + auto-starts; needs admin)
#
# ── VERIFY — AND DO NOT SKIP THE REFUSALS ───────────────────────────────────
# Substitute your own hostname. The first three prove she is reachable; the
# last three prove she is not WIDE OPEN, and those are the ones that matter.
#
#   H=https://<your-tunnel-host>
#   curl -s -o /dev/null -w '%{http_code}\n' $H/public-state.json   # want 200
#   curl -s -o /dev/null -w '%{http_code}\n' $H/minds-eye.json      # want 200
#   curl -s -o /dev/null -w '%{http_code}\n' $H/health              # want 200
#   curl -s -o /dev/null -w '%{http_code}\n' $H/admin/status        # want 404
#   curl -s -o /dev/null -w '%{http_code}\n' -X POST $H/reset       # want 404
#   curl -s -o /dev/null -w '%{http_code}\n' $H/ctl/status          # want 404
#
# ⭐ A 200 from any of the last three means this file is not doing its job.
#   Stop the tunnel before investigating — `POST /reset` wipes every trained
#   weight, and at that point it would be a public URL.

tunnel: 30417290-1c95-4a10-8648-15a70646938f
credentials-file: C:\Users\gfour\.cloudflared\30417290-1c95-4a10-8648-15a70646938f.json

# Keep the connection healthy through long quiet periods — she can go minutes
# without a public request while teaching.
originRequest:
  connectTimeout: 30s
  noHappyEyeballs: true

ingress:
  # ── PUBLIC READ LANES — the same three the old nginx vhost served openly ──

  # The dashboard snapshot every public viewer polls. Also the console-ring
  # tunnel (`?console=N`); query strings are not part of path matching, so that
  # keeps working without a rule of its own.
  - hostname: brain.theunitybrain.com
    path: ^/public-state\.json$
    service: http://127.0.0.1:7525

  # Her mind's eye — the current percept frame.
  - hostname: brain.theunitybrain.com
    path: ^/minds-eye\.json$
    service: http://127.0.0.1:7525

  # ⭐ /health — AND THIS ONE IS LOAD-BEARING IN A WAY THE OLD NGINX MISSED.
  #
  # `js/brain/remote-brain.js` gates its connection on `fetch('/health')`: if
  # health answers, there IS a live brain behind this origin, so the page keeps
  # probing for MINUTES rather than dropping a visitor to the 6,700-neuron
  # in-browser fallback. That gate exists because visitors landing during a
  # teach pin were getting the fake brain and seeing "7k neurons" while the
  # real one ran at 306M.
  #
  # ⛔ The old public nginx vhost NEVER FORWARDED /health — zero mentions in
  # deploy/nginx-unity-brain.conf — so on the deployed site that gate could
  # never fire, and the long-probe fix it guards has likely never once taken
  # effect in production. Exposing it here makes it work for the first time.
  #
  # Safe to publish: it returns status/uptime/neurons/scale/gpu/vram/clients/
  # spikes/psi/clusters — the same class of public figures already served by
  # public-state.json, no secrets and nothing mutable.
  - hostname: brain.theunitybrain.com
    path: ^/health$
    service: http://127.0.0.1:7525

  # The PUBLIC WebSocket lane (chat + live state). ⚠ This is `/ws`, NOT
  # `/admin/ws` — the admin socket is the Basic-auth-gated one and stays off.
  # cloudflared upgrades WebSockets by default; no extra setting is needed.
  - hostname: brain.theunitybrain.com
    path: ^/ws$
    service: http://127.0.0.1:7525

  # /image/<id>.png — a picture she ALREADY MADE, from a bounded cache (the
  # chat lane's <img>). A miss is a 404, never a render: nothing a visitor
  # sends through here can reach the image engine on :5124, which stays
  # loopback-only. Read-only, so it belongs with the three above.
  - hostname: brain.theunitybrain.com
    path: ^/image/[a-f0-9]{16}\.png$
    service: http://127.0.0.1:7525

  # ── ⛔ DEFAULT DENY — everything not named above ─────────────────────────
  # This is what keeps /admin/*, /reset, /update, /shutdown, /savererun and the
  # :7526 control plane off the internet. It must stay LAST, and it must stay.
  - service: http_status:404
