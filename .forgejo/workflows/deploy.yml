# Unity brain — FULL auto-deploy (PA.4.7): static frontend + Node backend.
#
# Every push to main does TWO things on the host that serves the domain:
#   1. rsync the static frontend (donor page + chat/dashboard UI) to the pages
#      web root (served at https://<repo-lowercased>.git.unityailab.com via the
#      wildcard nginx vhost), AND
#   2. rsync the Node brain-server backend (server/ + js/ + corpora/) to the
#      backend dir, npm ci, and restart the unity-brain systemd service.
#
# This is what makes #32 work: the deployed static page trains off donor browser
# GPUs because the Node brain-server is LIVE on the same server git lives on,
# kept running + updated automatically by this workflow.
#
# ONE-TIME PREREQUISITE: run deploy/bootstrap-backend.sh ONCE as root on the
# server (installs the systemd unit + nginx WSS reverse-proxy + Forgejo auth +
# the NOPASSWD sudo that lets this workflow restart the service). After that,
# every push is fully automatic.
#
# Requires the org/repo Actions secrets the lab already uses for pages:
#   PAGES_DEPLOY_KEY (base64 SSH private key) · PAGES_DEPLOY_HOST · PAGES_DEPLOY_USER
# Optional repo var: UNITY_BRAIN_BACKEND_DIR (default /opt/unity-brain).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        env:
          KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # KEY is base64-encoded in the secret to survive newline mangling through CI.
          printf '%s' "$KEY" | base64 -d > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy

      - name: Deploy static frontend to the pages web root (SSH rsync)
        env:
          HOST: ${{ secrets.PAGES_DEPLOY_HOST }}
          USER: ${{ secrets.PAGES_DEPLOY_USER }}
        run: |
          REPO="$(echo "${{ github.event.repository.name }}" | tr 'A-Z' 'a-z')"
          # PAGESTALE — donor-release.yml runs a BYTE-IDENTICAL copy of this rsync
          # (its own final step), because its Actions-token push to main cannot
          # trigger this workflow. If the exclude list below changes, change it
          # there too or the two lanes publish different sites.
          # Frontend only — exclude backend, training data, deps, internals, docs.
          # NOTE: assets/ (incl. assets/social/*.png per-page social images) DOES ship.
          # ── PUBDOCS (2026-08-20) — html/docs.html WAS OFFERING EIGHT BROKEN LINKS.
          # It renders `../docs/<NAME>.md` from a whitelist in its own source, but
          # `--exclude='docs'` + `--exclude='*.md'` meant NONE of those files were
          # ever deployed. Public nginx answers an unknown route with the SPA shell
          # at HTTP 200, so every one of them fetched 54KB of index HTML instead of
          # the document and rendered garbage — a "200-with-HTML is a lie" failure,
          # invisible unless you read the BODY rather than the status code.
          #
          # Fixed by deploying EXACTLY the page's own whitelist and nothing else.
          # rsync applies filters in order, first match wins, so these includes must
          # precede the excludes below — and `--include='docs/'` is required or rsync
          # never descends into the directory to see the file rules at all.
          #
          # Internal docs (TODO, FINALIZED, RESUME, NOW, the syllabus, the specs) stay
          # excluded on purpose: the frontend-only rule is deliberate, and this is a
          # whitelist of the eight public documents, not a change of policy. Adding a
          # doc to `DOC_PATHS` in html/docs.html now REQUIRES adding it here too, or
          # it silently 200s with HTML again.
          rsync -az --delete \
            --include='docs/' \
            --include='docs/ARCHITECTURE.md' \
            --include='docs/EQUATIONS.md' \
            --include='docs/ROADMAP.md' \
            --include='docs/SKILL_TREE.md' \
            --include='docs/SENSORY.md' \
            --include='docs/WEBSOCKET.md' \
            --include='docs/SETUP.md' \
            --include='README.md' \
            --exclude='.git' --exclude='.forgejo' --exclude='.gitea' \
            --exclude='.claude' --exclude='server' --exclude='corpora' \
            --exclude='node_modules' --exclude='scripts' --exclude='deploy' \
            --exclude='docs/**' --exclude='docs' --exclude='*.md' --exclude='donor-app' \
            --exclude='package.json' --exclude='package-lock.json' \
            -e "ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new" \
            ./ "${USER}@${HOST}:${REPO}/"

      # NOTE — backend auto-redeploy is intentionally NOT done here.
      #
      # On the lab host the pages-deploy SSH key (PAGES_DEPLOY_KEY) is
      # rrsync-locked to /var/www/pages with no shell, so it CANNOT rsync to
      # /opt or run `npm ci` / `sudo systemctl restart`. A backend step using it
      # would just be refused and turn this workflow red on every push.
      #
      # So the FRONTEND auto-deploys (the step above) and the BACKEND redeploys
      # MANUALLY when its code changes (it changes far less often):
      #
      #   cd "$BACKEND_DIR" && git pull \
      #     && (cd server && npm ci --omit=dev) \
      #     && sudo systemctl restart unity-brain
      #
      # To re-enable automatic backend deploy later, provision a SEPARATE deploy
      # identity (its own key + shell user + the NOPASSWD systemctl restart that
      # deploy/bootstrap-backend.sh grants) and restore an rsync-to-$BACKEND_DIR
      # + ssh-restart step here using that identity's secrets.
